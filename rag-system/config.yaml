# RAG System Configuration for Media Generation Platform
# This file controls all aspects of the RAG (Retrieval Augmented Generation) system

# =============================================================================
# EMBEDDING CONFIGURATION
# =============================================================================
embeddings:
  # Model for generating embeddings
  model_name: "sentence-transformers/all-MiniLM-L6-v2"

  # Alternative models (uncomment to use):
  # model_name: "sentence-transformers/all-mpnet-base-v2"  # Better quality, slower
  # model_name: "microsoft/codebert-base"  # Code-specific
  # model_name: "BAAI/bge-small-en-v1.5"  # Lightweight

  # Embedding dimension (must match model)
  dimension: 384

  # Batch size for embedding generation
  batch_size: 32

  # Device for model inference
  device: "cuda"  # Options: cuda, cpu, mps (Apple Silicon)

  # Normalize embeddings (recommended)
  normalize: true

  # Cache embeddings for unchanged files
  cache_embeddings: true
  cache_ttl: 86400  # 24 hours in seconds

  # Maximum sequence length
  max_seq_length: 512

# =============================================================================
# VECTOR STORE CONFIGURATION
# =============================================================================
vector_store:
  # Primary vector store type
  type: "chromadb"  # Options: chromadb, faiss, qdrant, pinecone

  # ChromaDB Configuration
  chromadb:
    persist_directory: "./data/chroma"
    collection_name: "media_generation_code"
    distance_metric: "cosine"  # Options: cosine, l2, ip (inner product)

  # FAISS Configuration (for local high-performance search)
  faiss:
    index_type: "IVF"  # Options: Flat, IVF, HNSW
    nlist: 100  # Number of clusters for IVF
    nprobe: 10  # Number of clusters to search
    persist_directory: "./data/faiss"

  # Qdrant Configuration (for distributed deployment)
  qdrant:
    url: "http://localhost:6333"
    collection_name: "media_generation_code"
    vector_size: 384
    distance: "Cosine"

  # Pinecone Configuration (cloud-based)
  pinecone:
    api_key: "${PINECONE_API_KEY}"
    environment: "us-west1-gcp"
    index_name: "media-generation"
    dimension: 384
    metric: "cosine"

# =============================================================================
# CHUNKING CONFIGURATION
# =============================================================================
chunking:
  # Code chunking strategy
  code:
    max_chunk_size: 1000  # Maximum characters per chunk
    min_chunk_size: 100   # Minimum characters per chunk
    overlap: 100          # Character overlap between chunks
    method: "semantic"    # Options: semantic, fixed, ast, function

    # Preserve context around chunks
    preserve_context: true
    include_imports: true
    include_docstrings: true

    # Language-specific settings
    python:
      split_by: "function"  # Options: function, class, module
      max_lines: 50
    sql:
      split_by: "statement"
      max_lines: 30
    yaml:
      split_by: "document"
      max_lines: 40

  # Documentation chunking strategy
  docs:
    max_chunk_size: 500
    min_chunk_size: 50
    overlap: 50
    method: "semantic"  # Options: semantic, header, paragraph

    # Markdown-specific settings
    markdown:
      split_by_headers: true
      preserve_code_blocks: true
      include_tables: true
      header_levels: [1, 2, 3]  # Split on H1, H2, H3

  # Configuration chunking
  config:
    max_chunk_size: 300
    overlap: 30
    preserve_structure: true

# =============================================================================
# SEARCH CONFIGURATION
# =============================================================================
search:
  # Default number of results to return
  default_top_k: 5

  # Maximum number of results allowed
  max_top_k: 50

  # Minimum similarity score threshold (0-1)
  similarity_threshold: 0.6

  # Enable re-ranking with cross-encoder
  enable_reranking: true
  reranking_model: "cross-encoder/ms-marco-MiniLM-L-6-v2"

  # Hybrid search configuration
  hybrid:
    enabled: true
    semantic_weight: 0.7  # Weight for vector similarity
    keyword_weight: 0.3   # Weight for keyword matching

  # Query expansion
  query_expansion:
    enabled: true
    max_synonyms: 3
    use_spacy: true

  # Filters
  filters:
    enable_file_type_filter: true
    enable_path_filter: true
    enable_date_filter: true
    enable_author_filter: false

  # Search modes
  modes:
    semantic: true     # Pure vector search
    keyword: true      # BM25 keyword search
    hybrid: true       # Combined search
    fuzzy: false       # Fuzzy string matching

# =============================================================================
# INDEXING CONFIGURATION
# =============================================================================
indexing:
  # Base path for indexing (relative to this config)
  base_path: "../"

  # File patterns to include
  include_patterns:
    - "**/*.py"
    - "**/*.md"
    - "**/*.yaml"
    - "**/*.yml"
    - "**/*.json"
    - "**/*.sql"
    - "**/*.sh"
    - "**/*.dockerfile"
    - "**/Dockerfile"
    - "**/docker-compose.yml"
    - "**/*.toml"
    - "**/*.ini"
    - "**/*.cfg"

  # File patterns to exclude
  exclude_patterns:
    - "**/__pycache__/**"
    - "**/venv/**"
    - "**/env/**"
    - "**/.venv/**"
    - "**/node_modules/**"
    - "**/.git/**"
    - "**/.github/**"
    - "**/data/**"
    - "**/logs/**"
    - "**/cache/**"
    - "**/*.pyc"
    - "**/*.pyo"
    - "**/*.pyd"
    - "**/.DS_Store"
    - "**/Thumbs.db"
    - "**/*.egg-info/**"
    - "**/dist/**"
    - "**/build/**"
    - "**/.pytest_cache/**"
    - "**/.mypy_cache/**"
    - "**/.ruff_cache/**"
    - "**/coverage/**"
    - "**/.coverage"

  # Directory priorities (higher = more important)
  priorities:
    "backend/src/domain": 10
    "backend/src/application": 9
    "backend/src/infrastructure": 8
    "backend/src/api": 7
    "docs": 8
    "tests": 5

  # Batch processing
  batch_size: 100
  parallel_workers: 4

  # Incremental indexing
  watch_mode: false
  refresh_interval: 3600  # seconds (1 hour)

  # Index maintenance
  auto_optimize: true
  optimize_interval: 86400  # 24 hours
  cleanup_orphaned: true

  # Metadata extraction
  extract_metadata: true
  metadata_fields:
    - file_path
    - file_name
    - file_type
    - line_start
    - line_end
    - function_name
    - class_name
    - imports
    - dependencies
    - last_modified
    - author
    - git_hash

# =============================================================================
# API CONFIGURATION
# =============================================================================
api:
  # Server settings
  host: "0.0.0.0"
  port: 8001
  workers: 4

  # CORS settings
  cors_origins:
    - "http://localhost:3000"
    - "http://localhost:8000"
    - "*"  # Allow all (development only)
  cors_methods: ["GET", "POST"]
  cors_headers: ["*"]

  # Rate limiting
  rate_limit:
    enabled: true
    requests_per_minute: 100
    requests_per_hour: 1000
    burst: 10

  # Authentication
  auth:
    enabled: false  # Set to true for production
    api_key_header: "X-API-Key"
    api_keys: []  # List of valid API keys

  # Request limits
  limits:
    max_query_length: 500
    max_top_k: 50
    max_context_tokens: 8000

  # Response settings
  response:
    include_metadata: true
    include_scores: true
    include_embeddings: false
    pretty_json: true

# =============================================================================
# CACHING CONFIGURATION
# =============================================================================
caching:
  # Enable query result caching
  enabled: true

  # Cache backend
  backend: "redis"  # Options: redis, memory, file

  # Redis configuration
  redis:
    host: "localhost"
    port: 6379
    db: 1
    password: null
    ssl: false

  # Cache TTL (time-to-live)
  query_cache_ttl: 3600      # 1 hour
  embedding_cache_ttl: 86400  # 24 hours
  result_cache_ttl: 1800      # 30 minutes

  # Cache size limits
  max_cache_size: 1000  # Maximum number of cached queries
  max_memory_mb: 500    # Maximum memory for cache

  # Cache invalidation
  auto_invalidate: true
  invalidate_on_index_update: true

# =============================================================================
# LOGGING CONFIGURATION
# =============================================================================
logging:
  # Log level
  level: "INFO"  # Options: DEBUG, INFO, WARNING, ERROR, CRITICAL

  # Log format
  format: "json"  # Options: json, text

  # Log outputs
  outputs:
    console:
      enabled: true
      level: "INFO"
    file:
      enabled: true
      path: "./data/logs/rag-system.log"
      level: "DEBUG"
      rotation: "1 day"
      retention: "7 days"

  # Structured logging fields
  include_fields:
    - timestamp
    - level
    - message
    - module
    - function
    - query
    - results_count
    - latency_ms
    - cache_hit

  # Performance logging
  log_slow_queries: true
  slow_query_threshold_ms: 1000

# =============================================================================
# MONITORING CONFIGURATION
# =============================================================================
monitoring:
  # Enable Prometheus metrics
  prometheus:
    enabled: true
    port: 9090
    path: "/metrics"

  # Metrics to track
  metrics:
    - search_latency
    - index_size
    - cache_hit_rate
    - query_count
    - error_rate
    - embedding_generation_time
    - vector_store_operations

  # Health checks
  health_check:
    enabled: true
    path: "/health"
    include_details: true

  # Alerts (future integration)
  alerts:
    enabled: false
    webhook_url: null

# =============================================================================
# PERFORMANCE CONFIGURATION
# =============================================================================
performance:
  # Parallel processing
  use_multiprocessing: true
  max_workers: 4

  # GPU acceleration
  use_gpu: true
  gpu_memory_fraction: 0.5

  # Batch processing
  enable_batching: true
  batch_timeout_ms: 100

  # Connection pooling
  database_pool_size: 10
  redis_pool_size: 10

  # Async operations
  enable_async: true
  async_timeout: 30

# =============================================================================
# CONTEXT BUILDER CONFIGURATION
# =============================================================================
context_builder:
  # Maximum context size for LLM
  max_context_tokens: 8000

  # Token estimation model
  tokenizer: "gpt-3.5-turbo"  # For token counting

  # Context assembly strategy
  strategy: "ranked"  # Options: ranked, diverse, recent

  # Include metadata in context
  include_metadata: true
  include_file_paths: true
  include_line_numbers: true

  # Context formatting
  format: "markdown"  # Options: markdown, json, plain

  # Related content
  include_related: true
  max_related_items: 3

  # Context window allocation
  allocation:
    query: 0.05      # 5% for query
    results: 0.85    # 85% for search results
    metadata: 0.10   # 10% for metadata

# =============================================================================
# QUALITY ASSURANCE
# =============================================================================
quality:
  # Validate search results
  validate_results: true

  # Minimum result quality score
  min_quality_score: 0.5

  # Content filtering
  filter_duplicates: true
  filter_low_quality: true

  # Result diversity
  ensure_diversity: true
  diversity_threshold: 0.85

  # Testing
  enable_test_queries: true
  test_query_file: "./tests/test_queries.yaml"

# =============================================================================
# ADVANCED FEATURES
# =============================================================================
advanced:
  # Multi-modal search (future)
  multimodal:
    enabled: false
    image_search: false
    video_search: false

  # Federated search (search multiple indices)
  federated_search:
    enabled: false
    indices: []

  # Graph-based search
  graph_search:
    enabled: false
    build_dependency_graph: false

  # Semantic caching (cache similar queries)
  semantic_cache:
    enabled: true
    similarity_threshold: 0.95

# =============================================================================
# ENVIRONMENT-SPECIFIC OVERRIDES
# =============================================================================
environments:
  development:
    logging:
      level: "DEBUG"
    api:
      cors_origins: ["*"]
    caching:
      enabled: false

  staging:
    logging:
      level: "INFO"
    api:
      rate_limit:
        requests_per_minute: 500

  production:
    logging:
      level: "WARNING"
    api:
      auth:
        enabled: true
      rate_limit:
        requests_per_minute: 1000
    performance:
      max_workers: 8
    monitoring:
      prometheus:
        enabled: true

# =============================================================================
# FEATURE FLAGS
# =============================================================================
features:
  experimental_reranking: false
  experimental_query_expansion: false
  experimental_semantic_cache: true
  beta_graph_search: false
  alpha_multimodal: false
